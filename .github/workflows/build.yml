name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Тесты
        run: pytest -q
      - name: Проверка импорта Windows-модулей
        run: python -c "import keylimiter.hook, keylimiter.gui, keylimiter.main, keylimiter.scheduler, keylimiter.wininput; print('imports ok')"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Сборка exe
        run: pyinstaller --clean --noconfirm build.spec
      - name: Проверка артефакта
        run: |
          if (-not (Test-Path dist/KeyLimiter.exe)) { throw "dist/KeyLimiter.exe не создан" }
          Get-Item dist/KeyLimiter.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: KeyLimiter-exe
          path: dist/KeyLimiter.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-exe-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Проверка актуальности сборки
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref.startsWith('refs/tags/v')) {
              core.setOutput('publish', true);
              return;
            }
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            const publish = ref.object.sha === context.sha;
            core.setOutput('publish', publish);
            if (!publish) {
              core.notice('Сборка устарела: main уже обновлён. Релиз пропущен.');
            }
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: KeyLimiter-exe
      - uses: softprops/action-gh-release@v2
        if: steps.current.outputs.publish == 'true'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('KeyLimiter {0}', github.ref_name) || format('KeyLimiter — сборка {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: KeyLimiter.exe
          fail_on_unmatched_files: true
          make_latest: "true"
          body: |
            Скачать KeyLimiter.exe можно из вложений этого релиза без аккаунта GitHub.
            Постоянная ссылка на последнюю сборку:
            https://github.com/${{ github.repository }}/releases/latest/download/KeyLimiter.exe
          generate_release_notes: true
